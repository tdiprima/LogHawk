<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogHawk Dashboard</title>
<style>
:root {
  --bg-page: #0d1117;
  --bg-card: #161b22;
  --bg-table-alt: #1c2128;
  --bg-hover: #1f2937;
  --bg-input: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --critical: #f85149;
  --high: #d29922;
  --medium: #e3b341;
  --low: #58a6ff;
  --info: #3fb950;
  --ok: #3fb950;
  --stale: #f85149;
  --miss: #8b949e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg-page);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* ── Header ──────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 13px;
  color: var(--text-dim);
}

.header-controls select,
.header-controls button {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 13px;
  cursor: pointer;
}

.header-controls button:hover { border-color: var(--accent); }

#refresh-status { min-width: 80px; text-align: right; }

/* ── Summary cards ───────────────────────────── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  padding: 16px 24px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s;
}

.card:hover { border-color: var(--accent); }
.card .value { font-size: 32px; font-weight: 700; }
.card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

.card-hosts .value { color: var(--accent); }
.card-critical .value { color: var(--critical); }
.card-high .value { color: var(--high); }
.card-medium .value { color: var(--medium); }
.card-stale .value { color: var(--stale); }

/* ── Tabs ────────────────────────────────────── */
.tab-bar {
  display: flex;
  gap: 0;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}

.tab-btn {
  padding: 10px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}

.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Tab content ─────────────────────────────── */
.tab-content { display: none; padding: 16px 24px; }
.tab-content.active { display: block; }

/* ── Tables ──────────────────────────────────── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.data-table th {
  text-align: left;
  padding: 8px 12px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
  position: sticky;
  top: 0;
  z-index: 1;
}

.data-table td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  max-width: 600px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.data-table tr:nth-child(even) { background: var(--bg-table-alt); }
.data-table tr:hover { background: var(--bg-hover); }

/* ── Badges ──────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.badge-critical { background: var(--critical); color: #fff; }
.badge-high { background: var(--high); color: #000; }
.badge-medium { background: var(--medium); color: #000; }
.badge-low { background: var(--low); color: #fff; }
.badge-info { background: var(--info); color: #000; }

.badge-ok { background: #1a3a2a; color: var(--ok); border: 1px solid var(--ok); }
.badge-stale { background: #3a1a1a; color: var(--stale); border: 1px solid var(--stale); }
.badge-miss { background: #2a2a2a; color: var(--miss); border: 1px solid var(--miss); }

/* ── Expandable raw log lines ────────────────── */
.raw-line {
  cursor: pointer;
  max-width: 500px;
}

.raw-line.expanded {
  white-space: pre-wrap;
  word-break: break-all;
  max-width: none;
}

/* ── Host cards ──────────────────────────────── */
.host-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

.host-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
}

.host-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.host-card-header .hostname {
  font-weight: 600;
  font-size: 15px;
}

.log-table {
  width: 100%;
  font-size: 13px;
}

.log-table td {
  padding: 3px 0;
  color: var(--text-dim);
}

.log-table td:first-child { font-family: monospace; }
.log-table td:nth-child(2) { text-align: right; padding-right: 10px; }
.log-table td:nth-child(3) { text-align: right; font-size: 12px; }

/* ── Search ──────────────────────────────────── */
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.search-bar input[type="text"] {
  flex: 1;
  min-width: 200px;
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 14px;
}

.search-bar input:focus { outline: none; border-color: var(--accent); }

.search-bar select {
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 14px;
}

.search-bar button {
  padding: 8px 20px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
}

.search-bar button:hover { opacity: 0.9; }

/* ── Filter bar (alerts) ─────────────────────── */
.filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.filter-bar label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
}

.filter-bar select {
  padding: 4px 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 13px;
}

/* ── Empty / error states ────────────────────── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-dim);
  font-size: 15px;
}

.error-banner {
  background: #3a1a1a;
  border: 1px solid var(--critical);
  color: var(--critical);
  padding: 8px 16px;
  margin: 16px 24px;
  border-radius: 4px;
}

/* ── Footer ──────────────────────────────────── */
footer {
  padding: 8px 24px;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  border-top: 1px solid var(--border);
}

.match-highlight {
  background: rgba(88, 166, 255, 0.25);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 1px;
}
</style>
</head>
<body>

<header>
  <div class="logo">LogHawk</div>
  <div class="header-controls">
    <label>Window:
      <select id="hours-select">
        <option value="1">1h</option>
        <option value="2">2h</option>
        <option value="6">6h</option>
        <option value="12">12h</option>
        <option value="24" selected>24h</option>
      </select>
    </label>
    <button id="refresh-btn">Refresh</button>
    <label><input type="checkbox" id="auto-refresh" checked> Auto</label>
    <span id="refresh-status">--</span>
  </div>
</header>

<!-- Summary cards -->
<div class="cards">
  <div class="card card-hosts" data-action="tab:hosts">
    <div class="value" id="card-hosts">-</div>
    <div class="label">Hosts Monitored</div>
  </div>
  <div class="card card-critical" data-action="tab:alerts" data-filter="CRITICAL">
    <div class="value" id="card-critical">-</div>
    <div class="label">Critical</div>
  </div>
  <div class="card card-high" data-action="tab:alerts" data-filter="HIGH">
    <div class="value" id="card-high">-</div>
    <div class="label">High</div>
  </div>
  <div class="card card-medium" data-action="tab:alerts" data-filter="MEDIUM">
    <div class="value" id="card-medium">-</div>
    <div class="label">Medium</div>
  </div>
  <div class="card card-stale" data-action="tab:hosts">
    <div class="value" id="card-stale">-</div>
    <div class="label">Stale Pipelines</div>
  </div>
</div>

<!-- Tabs -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="alerts">Alerts</button>
  <button class="tab-btn" data-tab="hosts">Hosts</button>
  <button class="tab-btn" data-tab="search">Search</button>
</div>

<!-- Alerts tab -->
<div id="tab-alerts" class="tab-content active">
  <div class="filter-bar">
    <label>Severity:
      <select id="filter-severity">
        <option value="all">All</option>
        <option value="CRITICAL">Critical</option>
        <option value="HIGH">High+</option>
        <option value="MEDIUM">Medium+</option>
        <option value="LOW">Low+</option>
      </select>
    </label>
    <label>Host:
      <select id="filter-host"><option value="all">All hosts</option></select>
    </label>
    <label>Category:
      <select id="filter-category"><option value="all">All categories</option></select>
    </label>
    <span id="alert-count" style="color: var(--text-dim); font-size: 13px; margin-left: auto;"></span>
  </div>
  <div id="alerts-body"></div>
</div>

<!-- Hosts tab -->
<div id="tab-hosts" class="tab-content">
  <div id="hosts-body"></div>
</div>

<!-- Search tab -->
<div id="tab-search" class="tab-content">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search across all logs (literal match, case-insensitive)...">
    <select id="search-host"><option value="">All hosts</option></select>
    <select id="search-log">
      <option value="">All logs</option>
      <option value="auth.log">auth.log</option>
      <option value="kern.log">kern.log</option>
      <option value="cron.log">cron.log</option>
      <option value="audit.log">audit.log</option>
      <option value="syslog.log">syslog.log</option>
    </select>
    <button id="search-btn">Search</button>
  </div>
  <div id="search-body"></div>
</div>

<footer>
  LogHawk Dashboard &mdash; fleet log aggregation
</footer>

<script>
"use strict";

// ── State ───────────────────────────────────────────────
const SEVERITY_RANK = { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1, INFO: 0 };
let refreshTimer = null;
let countdown = 30;
const REFRESH_INTERVAL = 30;

// ── DOM helpers ─────────────────────────────────────────
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(isoStr) {
  if (!isoStr) return "--";
  try {
    const d = new Date(isoStr);
    return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (e) {
    return isoStr;
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function badgeSeverity(sev) {
  const cls = "badge badge-" + sev.toLowerCase();
  return '<span class="' + cls + '">' + escapeHtml(sev) + "</span>";
}

function badgeStatus(status) {
  const cls = "badge badge-" + status.toLowerCase();
  return '<span class="' + cls + '">' + escapeHtml(status) + "</span>";
}

// ── API ─────────────────────────────────────────────────
async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  return resp.json();
}

// ── Render: overview cards ──────────────────────────────
function renderOverview(data) {
  $("#card-hosts").textContent = data.hosts.total;
  $("#card-critical").textContent = data.alerts.CRITICAL || 0;
  $("#card-high").textContent = data.alerts.HIGH || 0;
  $("#card-medium").textContent = data.alerts.MEDIUM || 0;
  $("#card-stale").textContent = data.hosts.stale + data.hosts.missing;

  populateHostDropdowns(data.host_list || []);
}

function populateHostDropdowns(hosts) {
  const filterHost = $("#filter-host");
  const searchHost = $("#search-host");
  const current1 = filterHost.value;
  const current2 = searchHost.value;

  filterHost.innerHTML = '<option value="all">All hosts</option>';
  searchHost.innerHTML = '<option value="">All hosts</option>';

  for (const h of hosts) {
    filterHost.innerHTML += '<option value="' + escapeHtml(h) + '">' + escapeHtml(h) + "</option>";
    searchHost.innerHTML += '<option value="' + escapeHtml(h) + '">' + escapeHtml(h) + "</option>";
  }

  filterHost.value = current1;
  searchHost.value = current2;
}

// ── Render: alerts ──────────────────────────────────────
let allAlerts = [];
let knownCategories = new Set();

function renderAlerts(data) {
  allAlerts = data.alerts || [];

  for (const a of allAlerts) {
    if (a.category) knownCategories.add(a.category);
  }
  const catSelect = $("#filter-category");
  const currentCat = catSelect.value;
  catSelect.innerHTML = '<option value="all">All categories</option>';
  for (const cat of [...knownCategories].sort()) {
    catSelect.innerHTML += '<option value="' + escapeHtml(cat) + '">' + escapeHtml(cat) + "</option>";
  }
  catSelect.value = currentCat;

  applyAlertFilters();
}

function applyAlertFilters() {
  const sevFilter = $("#filter-severity").value;
  const hostFilter = $("#filter-host").value;
  const catFilter = $("#filter-category").value;

  const minRank = sevFilter === "all" ? -1 : (SEVERITY_RANK[sevFilter] || 0);

  const filtered = allAlerts.filter((a) => {
    if (minRank >= 0 && (SEVERITY_RANK[a.severity] || 0) < minRank) return false;
    if (hostFilter !== "all" && a.host !== hostFilter) return false;
    if (catFilter !== "all" && a.category !== catFilter) return false;
    return true;
  });

  $("#alert-count").textContent = filtered.length + " of " + allAlerts.length + " alerts";

  if (filtered.length === 0) {
    $("#alerts-body").innerHTML = '<div class="empty-state">No alerts match the current filters.</div>';
    return;
  }

  let html = '<table class="data-table"><thead><tr>';
  html += "<th>Severity</th><th>Time</th><th>Host</th><th>Description</th><th>Category</th><th>Log</th></tr></thead><tbody>";

  for (const a of filtered.slice(0, 300)) {
    html += "<tr>";
    html += "<td>" + badgeSeverity(a.severity) + "</td>";
    html += "<td>" + escapeHtml(formatTime(a.timestamp)) + "</td>";
    html += "<td>" + escapeHtml(a.host || "") + "</td>";
    html += "<td>" + escapeHtml(a.description) + "</td>";
    html += "<td>" + escapeHtml(a.category || "") + "</td>";
    html += '<td class="raw-line" title="Click to expand">' + escapeHtml(a.raw_line || a.log_file || "") + "</td>";
    html += "</tr>";
  }

  html += "</tbody></table>";

  if (filtered.length > 300) {
    html += '<div style="padding:8px;color:var(--text-dim);font-size:13px">Showing 300 of ' + filtered.length + " matching alerts.</div>";
  }

  $("#alerts-body").innerHTML = html;
}

// ── Render: hosts ───────────────────────────────────────
function renderHosts(data) {
  const hosts = data.hosts || [];

  if (hosts.length === 0) {
    $("#hosts-body").innerHTML = '<div class="empty-state">No hosts found under log base. Check that rsyslog agents are forwarding logs.</div>';
    return;
  }

  let html = '<div class="host-grid">';

  for (const host of hosts) {
    html += '<div class="host-card">';
    html += '<div class="host-card-header">';
    html += '<span class="hostname">' + escapeHtml(host.name) + "</span>";
    html += badgeStatus(host.status);
    html += "</div>";

    html += '<table class="log-table">';
    for (const logFile of host.logs) {
      const ageText = logFile.age_minutes >= 0 ? logFile.age_minutes + "m ago" : "--";
      const sizeText = logFile.size_bytes > 0 ? formatSize(logFile.size_bytes) : "--";
      const statusColor =
        logFile.status === "OK" ? "var(--ok)" :
        logFile.status === "STALE" ? "var(--stale)" : "var(--miss)";

      html += "<tr>";
      html += "<td>" + escapeHtml(logFile.name) + "</td>";
      html += '<td style="color:' + statusColor + '">' + escapeHtml(ageText) + "</td>";
      html += "<td>" + escapeHtml(sizeText) + "</td>";
      html += "</tr>";
    }
    html += "</table></div>";
  }

  html += "</div>";
  html += '<div style="padding:12px 0;color:var(--text-dim);font-size:12px">Logs older than ' + data.stale_minutes + " minutes are marked stale.</div>";
  $("#hosts-body").innerHTML = html;
}

// ── Render: search results ──────────────────────────────
function renderSearch(data) {
  if (data.error) {
    $("#search-body").innerHTML = '<div class="error-banner">' + escapeHtml(data.error) + "</div>";
    return;
  }

  if (!data.results || data.results.length === 0) {
    $("#search-body").innerHTML = '<div class="empty-state">No results for "' + escapeHtml(data.query) + '"</div>';
    return;
  }

  const query = data.query || "";
  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const highlightRe = escapedQuery ? new RegExp("(" + escapedQuery + ")", "gi") : null;

  let html = '<div style="padding:4px 0 8px;color:var(--text-dim);font-size:13px">';
  html += data.total + " match" + (data.total !== 1 ? "es" : "");
  if (data.truncated) html += " (showing first " + data.results.length + ")";
  html += "</div>";

  html += '<table class="data-table"><thead><tr>';
  html += "<th>Host</th><th>Log</th><th>Time</th><th>Line</th></tr></thead><tbody>";

  for (const r of data.results) {
    let lineHtml = escapeHtml(r.line);
    if (highlightRe) {
      lineHtml = r.line.replace(highlightRe, function(match) {
        return '\x00HLSTART\x00' + match + '\x00HLEND\x00';
      });
      lineHtml = escapeHtml(lineHtml);
      lineHtml = lineHtml.replace(/\x00HLSTART\x00/g, '<span class="match-highlight">');
      lineHtml = lineHtml.replace(/\x00HLEND\x00/g, "</span>");
    }

    html += "<tr>";
    html += "<td>" + escapeHtml(r.host) + "</td>";
    html += "<td>" + escapeHtml(r.file) + "</td>";
    html += "<td>" + escapeHtml(formatTime(r.timestamp)) + "</td>";
    html += '<td class="raw-line" title="Click to expand">' + lineHtml + "</td>";
    html += "</tr>";
  }

  html += "</tbody></table>";
  $("#search-body").innerHTML = html;
}

// ── Tab switching ───────────────────────────────────────
function switchTab(tabName) {
  for (const btn of $$(".tab-btn")) {
    btn.classList.toggle("active", btn.dataset.tab === tabName);
  }
  for (const content of $$(".tab-content")) {
    content.classList.toggle("active", content.id === "tab-" + tabName);
  }
}

// ── Refresh ─────────────────────────────────────────────
async function refresh() {
  const hours = parseInt($("#hours-select").value, 10) || 24;
  $("#refresh-status").textContent = "loading...";

  try {
    const [overview, alerts, pipeline] = await Promise.all([
      fetchJSON("/api/overview?hours=" + hours),
      fetchJSON("/api/alerts?hours=" + hours),
      fetchJSON("/api/pipeline"),
    ]);

    renderOverview(overview);
    renderAlerts(alerts);
    renderHosts(pipeline);

    const now = new Date();
    $("#refresh-status").textContent = now.toLocaleTimeString();
  } catch (err) {
    $("#refresh-status").textContent = "error";
    console.error("Refresh failed:", err);
  }

  countdown = REFRESH_INTERVAL;
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);

  refreshTimer = setInterval(function() {
    if (!$("#auto-refresh").checked) return;

    countdown--;
    if (countdown <= 0) {
      refresh();
    }
  }, 1000);
}

// ── Search handler ──────────────────────────────────────
async function doSearch() {
  const query = $("#search-input").value.trim();
  if (!query) return;

  const host = $("#search-host").value;
  const log = $("#search-log").value;

  let url = "/api/search?q=" + encodeURIComponent(query);
  if (host) url += "&host=" + encodeURIComponent(host);
  if (log) url += "&log=" + encodeURIComponent(log);

  $("#search-body").innerHTML = '<div class="empty-state">Searching...</div>';

  try {
    const data = await fetchJSON(url);
    renderSearch(data);
  } catch (err) {
    $("#search-body").innerHTML = '<div class="error-banner">Search failed: ' + escapeHtml(err.message) + "</div>";
  }
}

// ── Raw line expand/collapse ────────────────────────────
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("raw-line")) {
    e.target.classList.toggle("expanded");
  }
});

// ── Init ────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function() {
  // Tab buttons
  for (const btn of $$(".tab-btn")) {
    btn.addEventListener("click", function() {
      switchTab(this.dataset.tab);
    });
  }

  // Summary card clicks
  for (const card of $$(".card[data-action]")) {
    card.addEventListener("click", function() {
      const action = this.dataset.action;
      if (action.startsWith("tab:")) {
        switchTab(action.slice(4));
      }
    });
  }

  // Filter changes re-render alerts client-side
  $("#filter-severity").addEventListener("change", applyAlertFilters);
  $("#filter-host").addEventListener("change", applyAlertFilters);
  $("#filter-category").addEventListener("change", applyAlertFilters);

  // Hours change triggers full refresh
  $("#hours-select").addEventListener("change", refresh);

  // Manual refresh
  $("#refresh-btn").addEventListener("click", refresh);

  // Search
  $("#search-btn").addEventListener("click", doSearch);
  $("#search-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") doSearch();
  });

  // Go
  refresh();
  startAutoRefresh();
});
</script>
</body>
</html>
